<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Create Account | Smart Energy Management System
    </title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #003d2b,
                    #07864d
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .register-container {

            width: 100%;

            max-width: 550px;

            background: white;

            border-radius: 18px;

            padding: 45px;

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, .2);
        }


        h1 {

            text-align: center;

            color: #101c2a;

            margin-bottom: 10px;
        }


        .subtitle {

            text-align: center;

            color: #6b7786;

            margin-bottom: 30px;
        }


        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            font-weight: 600;

            margin-bottom: 8px;

            color: #273342;
        }


        input {

            width: 100%;

            height: 52px;

            padding: 0 15px;

            border:
                1px solid #d2d8df;

            border-radius: 9px;

            font-size: 16px;

            outline: none;
        }


        input:focus {

            border-color: #07864d;

            box-shadow:
                0 0 0 3px
                rgba(7, 134, 77, .10);
        }


        button {

            width: 100%;

            height: 55px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    90deg,
                    #07864d,
                    #15945a
                );

            color: white;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;
        }


        button:hover {

            opacity: .92;
        }


        .message {

            min-height: 24px;

            margin-top: 18px;

            text-align: center;

            font-weight: 600;
        }


        .error {

            color: #d32f2f;
        }


        .success {

            color: #07864d;
        }


        .login-link {

            text-align: center;

            margin-top: 22px;

            color: #6b7786;
        }


        .login-link a {

            color: #07864d;

            font-weight: 700;

            text-decoration: none;
        }


        .login-link a:hover {

            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="register-container">


    <!-- TITLE -->

    <h1>
        Create New Account
    </h1>


    <p class="subtitle">
        AI Based Smart Energy Management System
    </p>



    <!-- REGISTRATION FORM -->

    <form id="registerForm">


        <!-- FULL NAME -->

        <div class="form-group">

            <label for="fullName">
                Full Name
            </label>


            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                required
            >

        </div>



        <!-- EMAIL -->

        <div class="form-group">

            <label for="registerEmail">
                Email
            </label>


            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email address"
                required
            >

        </div>



        <!-- PASSWORD -->

        <div class="form-group">

            <label for="registerPassword">
                Password
            </label>


            <input
                type="password"
                id="registerPassword"
                placeholder="Minimum 6 characters"
                required
            >

        </div>



        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>


            <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter your password"
                required
            >

        </div>



        <!-- CREATE ACCOUNT BUTTON -->

        <button type="submit">

            Create Account

        </button>



        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


    </form>



    <!-- LOGIN LINK -->

    <div class="login-link">

        Already have an account?

        <a href="login.html">

            Login here

        </a>

    </div>


</div>



<script>


/* =========================================
   ELEMENTS
========================================= */

const registerForm =
    document.getElementById(
        "registerForm"
    );


const message =
    document.getElementById(
        "message"
    );



/* =========================================
   REGISTER ACCOUNT
========================================= */

registerForm.addEventListener(
    "submit",
    function (event) {


        event.preventDefault();



        /* GET INPUT VALUES */

        const fullName =
            document
                .getElementById(
                    "fullName"
                )
                .value
                .trim();


        const email =
            document
                .getElementById(
                    "registerEmail"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "registerPassword"
                )
                .value;


        const confirmPassword =
            document
                .getElementById(
                    "confirmPassword"
                )
                .value;



        /* CLEAR OLD MESSAGE */

        message.className =
            "message";


        message.textContent =
            "";



        /* VALIDATE FULL NAME */

        if (fullName === "") {


            message.textContent =
                "Please enter your full name.";


            message.classList.add(
                "error"
            );


            return;

        }



        /* VALIDATE PASSWORD LENGTH */

        if (password.length < 6) {


            message.textContent =
                "Password must contain at least 6 characters.";


            message.classList.add(
                "error"
            );


            return;

        }



        /* VALIDATE PASSWORD MATCH */

        if (
            password !==
            confirmPassword
        ) {


            message.textContent =
                "Passwords do not match.";


            message.classList.add(
                "error"
            );


            return;

        }



        /* GET EXISTING USERS */

        const users =
            JSON.parse(
                localStorage.getItem(
                    "smartEnergyUsers"
                ) || "[]"
            );



        /* CHECK EMAIL ALREADY EXISTS */

        const existingUser =
            users.find(
                function (user) {

                    return (
                        user.email.toLowerCase() ===
                        email.toLowerCase()
                    );

                }
            );



        if (existingUser) {


            message.textContent =
                "An account with this email already exists.";


            message.classList.add(
                "error"
            );


            return;

        }



        /* SAVE NEW USER */

        users.push({

            fullName:
                fullName,

            email:
                email,

            password:
                password

        });



        localStorage.setItem(
            "smartEnergyUsers",
            JSON.stringify(users)
        );



        /* SUCCESS MESSAGE */

        message.textContent =
            "Account created successfully! Redirecting to login...";


        message.classList.add(
            "success"
        );



        /* REDIRECT TO LOGIN PAGE */

        setTimeout(
            function () {

                window.location.href =
                    "login.html";

            },

            1200
        );


    }
);


</script>


</body>

</html>
